<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="Frame — видео на странице">Frame — videos on this page</title><link rel="stylesheet" href="style.css"></head><body class="popup"><main class="shell">

</div><p id="youtube-note" class="youtube-note" hidden><span data-i18n="Для официального офлайн-просмотра рекомендуем">For official offline viewing, we recommend</span> <a href="https://www.youtube.com/premium" target="_blank" rel="noopener noreferrer">YouTube Premium</a>.</p><footer><span id="active-count"></span><span class="version">v0.1.0</span></footer></main>
