<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frame — видео на странице</title><link rel="stylesheet" href="style.css"></head><body class="popup"><main class="shell">
<header class="top"><a class="brand" href="popup.html" aria-label="Frame"><span class="brand-icon">↓</span>frame<span class="brand-dot">.</span></a><button id="manager" class="secondary small">Все загрузки ↗</button></header>
<section class="intro"><div class="heading-row"><h1>Видео на странице <span id="count" class="count">—</span></h1><button id="refresh" class="icon-button" title="Обновить список" aria-label="Обновить список">↻</button></div><p id="site" class="muted">Ищем видео…</p></section>
<div id="results" class="results" aria-busy="true">
<div id="loading" class="loading" role="status"><span class="sr-only">Ищем видео…</span><div class="skeleton-card" aria-hidden="true"></div><div class="skeleton-card" aria-hidden="true"></div></div>
<div id="notice" class="notice" role="status" hidden></div><button id="helper-setup" class="secondary" hidden>Установить помощник</button><div id="videos" aria-live="polite"></div>
<section id="empty" class="empty" hidden><div class="empty-icon">▷</div><h2>Сначала нажмите Play</h2><p>Запустите видео на странице,<br>затем обновите список.</p><button id="reload" class="secondary">Обновить список</button><p class="hint">После установки перезагрузите страницу.</p></section>
</div><p id="youtube-note" class="youtube-note" hidden>Для официального офлайн-просмотра рекомендуем <a href="https://www.youtube.com/premium" target="_blank" rel="noopener noreferrer">YouTube Premium</a>.</p><footer><span id="active-count"></span><span class="version">v0.1.0</span></footer></main>
<template id="video-template"><article class="video-card"><div class="video-heading"><span class="video-preview"><span class="preview-fallback" aria-hidden="true">▷</span><img class="thumbnail" alt="Превью видео" referrerpolicy="no-referrer" hidden></span><div class="video-heading-text"><h2 class="video-title"></h2><div class="video-details"><span class="format-badge">HLS</span><span class="duration"></span></div><div class="video-source"></div></div></div><div class="video-controls"><select class="quality" aria-label="Качество скачивания"></select><span class="download-size" title="Объём загрузки">Считаем…</span><button class="download primary small" aria-label="Скачать видео">↓ Скачать</button></div></article></template>
<script type="module" src="popup.js"></script></body></html>
