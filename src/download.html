<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Все загрузки — Frame</title><link rel="stylesheet" href="style.css"></head><body class="manager"><main class="dashboard">
<header class="top"><div class="brand"><span class="brand-icon">↓</span>frame<span class="brand-dot">.</span></div><span class="version">МЕНЕДЖЕР ЗАГРУЗОК</span></header>
<section class="manager-intro"><div><h1>Все загрузки <span id="count" class="count">0</span></h1><p id="summary" class="muted">Видео со всех сайтов в одном месте.</p></div><button id="clear" class="secondary small">Скрыть завершённые</button></section>
<div id="manager-notice" class="notice" hidden role="status"></div><div id="jobs"></div><section id="empty" class="empty" hidden><div class="empty-icon">↓</div><h2>Здесь будут ваши загрузки</h2><p>Откройте Frame на странице с видео,<br>выберите качество и нажмите «Скачать».</p></section>
<p class="manager-note">Не закрывайте эту вкладку, пока идут загрузки.</p></main>
<template id="job-template"><article class="job-row"><div class="job-top"><span class="media-icon">↓</span><div class="job-heading"><h2 class="job-title"></h2><p class="job-meta"></p></div><span class="state-tag">Ожидает</span></div><div class="job-bottom"><div class="job-progress"><div class="progress" role="progressbar" aria-label="Прогресс загрузки" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar"></div></div><div class="progress-meta"><span class="status" role="status"></span><span class="size"></span></div></div><div class="job-actions"><button class="start primary small">Начать скачивание</button><button class="cancel secondary small" hidden>Отменить</button><button class="show secondary small" hidden>Открыть</button><button class="remove icon-button" title="Убрать из списка" aria-label="Убрать из списка">×</button></div></div><div class="job-error notice" role="alert" hidden></div></article></template>
<script type="module" src="download.js"></script></body></html>
