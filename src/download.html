<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="Все загрузки — Frame">All downloads — Frame</title><link rel="stylesheet" href="style.css"></head><body class="manager"><main class="dashboard">
<header class="top"><div class="brand"><span class="brand-icon">↓</span>frame<span class="brand-dot">.</span></div><span class="version"><span data-i18n="МЕНЕДЖЕР ЗАГРУЗОК">DOWNLOAD MANAGER</span></span></header>
<section class="manager-intro"><div><h1><span data-i18n="Все загрузки">All downloads</span> <span id="count" class="count">0</span></h1><p id="summary" class="muted"><span data-i18n="Видео со всех сайтов в одном месте.">Videos from all sites in one place.</span></p></div><button id="clear" class="secondary small"><span data-i18n="Скрыть завершённые">Hide finished</span></button></section>
<div id="manager-notice" class="notice" hidden role="status"></div><div id="jobs"></div><section id="empty" class="empty" hidden><div class="empty-icon">↓</div><h2><span data-i18n="Здесь будут ваши загрузки">Your downloads will appear here</span></h2><p><span data-i18n="Откройте Frame на странице с видео,">Open Frame on a video page,</span><br><span data-i18n="выберите качество и нажмите «Скачать».">choose a quality and click Download.</span></p></section>
<p class="manager-note"><span data-i18n="Не закрывайте эту вкладку, пока идут загрузки.">Keep this tab open while downloads are running.</span></p></main>
<template id="job-template"><article class="job-row"><div class="job-top"><span class="media-icon">↓</span><div class="job-heading"><h2 class="job-title"></h2><p class="job-meta"></p></div><span class="state-tag"><span data-i18n="Ожидает">Waiting</span></span></div><div class="job-bottom"><div class="job-progress"><div class="progress" role="progressbar" aria-label="Download progress" data-i18n-aria-label="Прогресс загрузки" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar"></div></div><div class="progress-meta"><span class="status" role="status"></span><span class="size"></span></div></div><div class="job-actions"><button class="start primary small"><span data-i18n="Начать скачивание">Start download</span></button><button class="cancel secondary small" hidden><span data-i18n="Отменить">Cancel</span></button><button class="show secondary small" hidden><span data-i18n="Открыть">Show file</span></button><button class="remove icon-button" title="Remove from list" data-i18n-title="Убрать из списка" aria-label="Remove from list" data-i18n-aria-label="Убрать из списка">×</button></div></div><div class="job-error notice" role="alert" hidden></div></article></template>
<script type="module" src="download.js"></script></body></html>
